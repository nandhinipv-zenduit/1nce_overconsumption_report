name: Daily SIM Usage Audit
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  run-audit:
    runs-on: ubuntu-latest
    env:
      # Gmail (OAuth2 via Gmail API — no app password)
      GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      # 1NCE
      ONE_NCE_USERNAME: ${{ secrets.ONE_NCE_USERNAME }}
      ONE_NCE_PASSWORD: ${{ secrets.ONE_NCE_PASSWORD }}
      # Zenduit
      ZENDU_EMAIL: ${{ secrets.ZENDU_EMAIL }}
      ZENDU_PASSWORD: ${{ secrets.ZENDU_PASSWORD }}
      # Zoho CRM
      ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
      ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
      ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run SIM Usage Audit
        run: |
          python main.py
